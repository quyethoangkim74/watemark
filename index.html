<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <title>Tool Đóng Dấu Watermark Chữ & Logo Chuẩn Font</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Thư viện nén file Zip -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
    <!-- Thư viện chỉnh sửa PDF trên trình duyệt -->
    <script src="https://unpkg.com/pdf-lib@1.4.0/dist/pdf-lib.min.js"></script>

    <!--
      QUAN TRỌNG: không dùng link .woff2 cố định (hotlink) của Google Fonts nữa,
      vì các URL đó gắn với một "version hash" và Google có thể đổi hash bất cứ lúc nào
      -> link chết -> font không tải được -> canvas âm thầm rơi về sans-serif.
      Thay vào đó gọi thẳng Google Fonts CSS2 API (link chuẩn, luôn còn hiệu lực).
    -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Josefin+Sans:wght@400;600;700&family=Life+Savers:wght@400;700&display=swap" rel="stylesheet">

    <style>
        /* Dùng luôn font-family lấy từ Google Fonts CSS2 ở trên cho phần UI (không bắt buộc, chỉ để xem trước) */
        .font-josefin { font-family: 'Josefin Sans', sans-serif; }
        .font-lifesavers { font-family: 'Life Savers', cursive; }
    </style>
</head>
<body class="bg-gray-50 min-h-screen p-6">
    <div class="max-w-4xl mx-auto bg-white p-6 rounded-xl shadow-lg">
        <h1 class="text-2xl font-bold mb-6 text-gray-800 border-b pb-3">Tool Đóng Dấu Watermark (Chuẩn Font Josefin Sans & Life Savers)</h1>

        <div class="grid grid-cols-1 md:grid-cols-2 gap-6 mb-6">
            <!-- Cột 1: Cấu hình loại Watermark -->
            <div class="space-y-4 bg-blue-50/50 p-4 rounded-lg border border-blue-100">
                <h2 class="font-semibold text-blue-800 text-lg">1. Cấu hình nội dung Watermark</h2>

                <div>
                    <label class="block text-sm font-medium text-gray-700">Chọn dạng Watermark:</label>
                    <select id="wmType" onchange="toggleWmType()" class="mt-1 block w-full rounded-md border-gray-300 shadow-sm p-2 border bg-white">
                        <option value="text">Dạng Chữ (Text)</option>
                        <option value="image">Dạng Ảnh / Logo riêng (PNG/JPG)</option>
                    </select>
                </div>

                <!-- Phần cấu hình cho CHỮ -->
                <div id="textConfigSpace" class="space-y-3">
                    <div>
                        <label class="block text-sm font-medium text-gray-700">Nội dung Chữ:</label>
                        <input type="text" id="wmText" value="BẢN QUYỀN NỘI BỘ" class="mt-1 block w-full rounded-md border-gray-300 shadow-sm p-2 border bg-white">
                    </div>

                    <div>
                        <label class="block text-sm font-medium text-gray-700">Font chữ:</label>
                        <select id="wmFont" class="mt-1 block w-full rounded-md border-gray-300 shadow-sm p-2 border bg-white">
                            <option value="Josefin Sans">Josefin Sans (Thanh mảnh, hiện đại)</option>
                            <option value="Life Savers">Life Savers / Life Logo (Bo tròn, thân thiện)</option>
                            <option value="Arial">Arial (Tiêu chuẩn)</option>
                        </select>
                    </div>

                    <div class="grid grid-cols-2 gap-3">
                        <div>
                            <label class="block text-sm font-medium text-gray-700">Cỡ chữ:</label>
                            <input type="number" id="wmSize" value="30" class="mt-1 block w-full rounded-md border-gray-300 shadow-sm p-2 border bg-white">
                        </div>
                        <div>
                            <label class="block text-sm font-medium text-gray-700">Màu chữ:</label>
                            <input type="color" id="wmColor" value="#ff0000" class="mt-1 block w-full h-10 rounded-md border-gray-300 cursor-pointer bg-white">
                        </div>
                    </div>
                </div>

                <!-- Phần cấu hình cho ẢNH / LOGO -->
                <div id="imageConfigSpace" class="space-y-3 hidden">
                    <div>
                        <label class="block text-sm font-medium text-gray-700">Chọn file Ảnh/Logo đóng dấu:</label>
                        <input type="file" id="logoFileInput" accept="image/png, image/jpeg" class="mt-1 block w-full text-sm text-gray-500 file:mr-4 file:py-2 file:px-4 file:rounded-md file:border-0 file:text-sm file:font-semibold file:bg-green-50 file:text-green-700 hover:file:bg-green-100 bg-white border rounded-md">
                    </div>
                    <div>
                        <label class="block text-sm font-medium text-gray-700">Kích thước Logo so với file gốc: <span id="scaleValue" class="font-bold text-blue-600">20%</span></label>
                        <input type="range" id="logoScale" min="5" max="80" value="20" class="w-full accent-blue-600 mt-1">
                    </div>
                </div>

                <div class="grid grid-cols-2 gap-3 pt-2 border-t border-gray-200">
                    <div>
                        <label class="block text-sm font-medium text-gray-700">Góc xoay (Độ):</label>
                        <input type="number" id="wmAngle" value="0" class="mt-1 block w-full rounded-md border-gray-300 shadow-sm p-2 border bg-white">
                    </div>
                    <div>
                        <label class="block text-sm font-medium text-gray-700">Độ mờ (Opacity: 0.1 - 1):</label>
                        <input type="number" step="0.1" min="0.1" max="1" id="wmOpacity" value="0.6" class="mt-1 block w-full rounded-md border-gray-300 shadow-sm p-2 border bg-white">
                    </div>
                </div>
            </div>

            <!-- Cột 2: Vị trí & Chọn file nguồn -->
            <div class="space-y-4 bg-gray-50 p-4 rounded-lg border border-gray-200">
                <h2 class="font-semibold text-gray-800 text-lg">2. Vị trí & Chọn file cần đóng dấu</h2>

                <div>
                    <label class="block text-sm font-medium text-gray-700">Vị trí đặt Watermark:</label>
                    <select id="wmPosition" onchange="togglePosition()" class="mt-1 block w-full rounded-md border-gray-300 shadow-sm p-2 border bg-white">
                        <option value="bottom-center">Chính giữa bên dưới</option>
                        <option value="bottom-right">Góc dưới bên phải</option>
                        <option value="bottom-left">Góc dưới bên trái</option>
                        <option value="top-right">Góc trên bên phải</option>
                        <option value="top-left">Góc trên bên trái</option>
                        <option value="center">Chính giữa file</option>
                        <option value="custom">Tự do nhập tọa độ X, Y (Pixel)</option>
                        <option value="tile">Lặp lại toàn bộ ảnh</option>
                    </select>
                </div>

                <div id="customCoordSpace" class="grid grid-cols-2 gap-3 bg-amber-50 p-3 rounded-md border border-amber-200 hidden">
                    <div>
                        <label class="block text-xs font-medium text-amber-800">Tọa độ X:</label>
                        <input type="number" id="customX" value="50" class="mt-1 block w-full rounded-md border-gray-300 shadow-sm p-1.5 text-sm border bg-white">
                    </div>
                    <div>
                        <label class="block text-xs font-medium text-amber-800">Tọa độ Y:</label>
                        <input type="number" id="customY" value="50" class="mt-1 block w-full rounded-md border-gray-300 shadow-sm p-1.5 text-sm border bg-white">
                    </div>
                </div>

                <div>
                    <label class="block text-sm font-medium text-gray-700">Chọn tối đa 100 file (Ảnh hoặc PDF):</label>
                    <input type="file" id="fileInput" multiple accept="image/png, image/jpeg, application/pdf" class="mt-1 block w-full text-sm text-gray-500 file:mr-4 file:py-2 file:px-4 file:rounded-md file:border-0 file:text-sm file:font-semibold file:bg-blue-50 file:text-blue-700 hover:file:bg-blue-100 bg-white border rounded-md">
                </div>

                <div class="pt-2">
                    <button onclick="processFiles()" id="processBtn" class="w-full bg-blue-600 text-white py-3 px-4 rounded-md font-semibold hover:bg-blue-700 transition shadow-md flex items-center justify-center gap-2">
                        <span>Bắt đầu đóng dấu & Tải về (.zip)</span>
                    </button>
                </div>
            </div>
        </div>

        <!-- Khung xem trước (Preview) -->
        <div id="previewContainer" class="mt-6 border-t pt-4 hidden">
            <h3 class="font-bold text-gray-700 mb-2">Xem trước file đầu tiên:</h3>
            <div class="border rounded-lg p-2 bg-gray-100 flex justify-center overflow-hidden">
                <img id="previewImage" class="max-h-96 object-contain rounded shadow" alt="Preview">
            </div>
        </div>

        <div id="status" class="text-center font-medium text-blue-600 bg-blue-50 p-3 rounded-md mt-4 hidden"></div>
    </div>

    <script>
        const logoScaleInput = document.getElementById('logoScale');
        logoScaleInput.addEventListener('input', (e) => {
            document.getElementById('scaleValue').textContent = e.target.value + '%';
        });

        function toggleWmType() {
            const type = document.getElementById('wmType').value;
            if (type === 'text') {
                document.getElementById('textConfigSpace').classList.remove('hidden');
                document.getElementById('imageConfigSpace').classList.add('hidden');
            } else {
                document.getElementById('textConfigSpace').classList.add('hidden');
                document.getElementById('imageConfigSpace').classList.remove('hidden');
            }
        }

        function togglePosition() {
            const pos = document.getElementById('wmPosition').value;
            if (pos === 'custom') {
                document.getElementById('customCoordSpace').classList.remove('hidden');
            } else {
                document.getElementById('customCoordSpace').classList.add('hidden');
            }
        }

        function hexToRgba(hex) {
            let c = hex.replace('#', '');
            if (c.length === 3) c = c.split('').map(x => x + x).join('');
            const num = parseInt(c, 16);
            return { r: (num >> 16) & 255, g: (num >> 8) & 255, b: num & 255 };
        }

        function loadLogoImage() {
            return new Promise((resolve) => {
                const logoInput = document.getElementById('logoFileInput');
                if (!logoInput.files || logoInput.files.length === 0) {
                    resolve(null);
                    return;
                }
                const reader = new FileReader();
                reader.onload = function(e) {
                    const img = new Image();
                    img.onload = function() { resolve(img); };
                    img.src = e.target.result;
                };
                reader.readAsDataURL(logoInput.files[0]);
            });
        }

        /*
          SỬA LỖI FONT KHÔNG CHẠY:
          Trước đây code dùng new FontFace(name, url(...)) với URL .woff2 gắn cứng của Google
          -> các URL này có thể lỗi thời/sai hash bất kỳ lúc nào nên .load() sẽ reject,
          bị catch nuốt lỗi, và canvas vẽ chữ bằng font mặc định (sans-serif) mà không báo lỗi rõ ràng.

          Cách sửa: font đã được khai báo qua thẻ <link> Google Fonts CSS2 API ở <head>
          (URL này ổn định, không có hash riêng). Ở đây ta chỉ cần dùng document.fonts.load()
          để ÉP trình duyệt tải xong font đó trước khi vẽ lên canvas, và dùng document.fonts.check()
          để xác nhận đã tải thành công. Nếu thất bại thì cảnh báo rõ cho người dùng thay vì âm thầm dùng font khác.
        */
        async function ensureFontLoaded(fontName, size) {
            // Font hệ thống (Arial) thì không cần tải gì cả
            if (fontName !== 'Josefin Sans' && fontName !== 'Life Savers') {
                return true;
            }

            const fontSpecRegular = `${size}px "${fontName}"`;
            const fontSpecBold = `bold ${size}px "${fontName}"`;

            try {
                // Ép trình duyệt tải các weight cần dùng
                await Promise.all([
                    document.fonts.load(fontSpecRegular),
                    document.fonts.load(fontSpecBold)
                ]);
                // Chờ tất cả các font đang tải (kể cả từ thẻ <link>) hoàn tất
                await document.fonts.ready;
            } catch (err) {
                console.warn(`Không tải được font "${fontName}":`, err);
            }

            // Xác nhận font đã thực sự sẵn sàng để dùng trên canvas
            const loaded = document.fonts.check(fontSpecRegular);
            if (!loaded) {
                console.warn(`Font "${fontName}" chưa sẵn sàng sau khi chờ tải, canvas có thể dùng font dự phòng.`);
            }
            return loaded;
        }

        async function processFiles() {
            const fileInput = document.getElementById('fileInput');
            const files = fileInput.files;
            const statusDiv = document.getElementById('status');
            const previewContainer = document.getElementById('previewContainer');
            const previewImage = document.getElementById('previewImage');

            if (files.length === 0) {
                alert('Vui lòng chọn file!');
                return;
            }

            const wmType = document.getElementById('wmType').value;
            let logoImg = null;
            if (wmType === 'image') {
                logoImg = await loadLogoImage();
                if (!logoImg) {
                    alert('Vui lòng chọn ảnh logo!');
                    return;
                }
            }

            const config = {
                type: wmType,
                text: document.getElementById('wmText').value,
                font: document.getElementById('wmFont').value,
                size: parseFloat(document.getElementById('wmSize').value) || 30,
                colorHex: document.getElementById('wmColor').value,
                angle: parseFloat(document.getElementById('wmAngle').value) || 0,
                opacity: parseFloat(document.getElementById('wmOpacity').value) || 0.6,
                position: document.getElementById('wmPosition').value,
                customX: parseFloat(document.getElementById('customX').value) || 0,
                customY: parseFloat(document.getElementById('customY').value) || 0,
                logoScale: parseFloat(document.getElementById('logoScale').value) / 100,
                logoImg: logoImg
            };

            // Tải font (nếu là watermark dạng chữ) TRƯỚC khi xử lý bất kỳ file nào,
            // và chờ đảm bảo tải xong 1 lần duy nhất cho cả batch, thay vì tải lại từng ảnh.
            if (config.type === 'text') {
                statusDiv.classList.remove('hidden');
                statusDiv.textContent = `Đang tải font "${config.font}"...`;
                const fontOk = await ensureFontLoaded(config.font, config.size);
                if (!fontOk && config.font !== 'Arial') {
                    statusDiv.textContent = `Cảnh báo: không tải được font "${config.font}", sẽ dùng font dự phòng.`;
                }
            }

            statusDiv.classList.remove('hidden');
            statusDiv.textContent = `Đang xử lý...`;
            const zip = new JSZip();
            let firstProcessedUrl = null;

            for (let i = 0; i < files.length; i++) {
                const file = files[i];
                statusDiv.textContent = `Đang xử lý (${i + 1}/${files.length}): ${file.name}`;

                if (file.type.startsWith('image/')) {
                    const processedBlob = await addWatermarkToImage(file, config);
                    zip.file(`watermarked_${file.name}`, processedBlob);
                    if (i === 0) firstProcessedUrl = URL.createObjectURL(processedBlob);
                } else if (file.type === 'application/pdf') {
                    const processedBytes = await addWatermarkToPDF(file, config);
                    zip.file(`watermarked_${file.name}`, processedBytes);
                }
            }

            if (firstProcessedUrl) {
                previewImage.src = firstProcessedUrl;
                previewContainer.classList.remove('hidden');
            }

            statusDiv.textContent = 'Đang đóng gói ZIP...';
            const content = await zip.generateAsync({ type: 'blob' });
            const link = document.createElement('a');
            link.href = URL.createObjectURL(content);
            link.download = `watermarked_files_${Date.now()}.zip`;
            link.click();
            statusDiv.textContent = 'Hoàn tất!';
        }

        async function addWatermarkToImage(file, config) {
            return new Promise((resolve) => {
                const reader = new FileReader();
                reader.onload = function (e) {
                    const img = new Image();
                    img.onload = function () {
                        const canvas = document.createElement('canvas');
                        canvas.width = img.width;
                        canvas.height = img.height;
                        const ctx = canvas.getContext('2d');

                        ctx.drawImage(img, 0, 0);

                        if (config.type === 'text') {
                            ctx.globalAlpha = config.opacity;
                            const rgba = hexToRgba(config.colorHex);
                            ctx.fillStyle = `rgb(${rgba.r}, ${rgba.g}, ${rgba.b})`;
                            // Font đã được nạp sẵn trước batch (ensureFontLoaded) nên tới đây
                            // document.fonts đã có font này và canvas sẽ vẽ đúng font.
                            ctx.font = `${config.size}px "${config.font}", sans-serif`;
                            ctx.textBaseline = 'middle';

                            const textMetrics = ctx.measureText(config.text);
                            const textWidth = textMetrics.width;
                            const padding = 40;

                            if (config.position === 'tile') {
                                ctx.save();
                                ctx.rotate((config.angle * Math.PI) / 180);
                                const stepX = 400, stepY = 250;
                                for (let y = -canvas.height; y < canvas.height * 2; y += stepY) {
                                    for (let x = -canvas.width; x < canvas.width * 2; x += stepX) {
                                        ctx.fillText(config.text, x, y);
                                    }
                                }
                                ctx.restore();
                            } else {
                                let x = padding, y = padding + config.size / 2;
                                if (config.position === 'bottom-center') {
                                    x = canvas.width / 2; y = canvas.height - padding - config.size / 2; ctx.textAlign = 'center';
                                } else if (config.position === 'bottom-right') {
                                    x = canvas.width - textWidth - padding; y = canvas.height - padding - config.size / 2; ctx.textAlign = 'left';
                                } else if (config.position === 'bottom-left') {
                                    x = padding; y = canvas.height - padding - config.size / 2; ctx.textAlign = 'left';
                                } else if (config.position === 'top-right') {
                                    x = canvas.width - textWidth - padding; y = padding + config.size / 2; ctx.textAlign = 'left';
                                } else if (config.position === 'top-left') {
                                    x = padding; y = padding + config.size / 2; ctx.textAlign = 'left';
                                } else if (config.position === 'center') {
                                    x = canvas.width / 2; y = canvas.height / 2; ctx.textAlign = 'center';
                                } else if (config.position === 'custom') {
                                    x = config.customX; y = config.customY; ctx.textAlign = 'left';
                                }

                                if (config.angle !== 0) {
                                    ctx.save();
                                    ctx.translate(x + textWidth / 2, y);
                                    ctx.rotate((config.angle * Math.PI) / 180);
                                    ctx.textAlign = 'center';
                                    ctx.fillText(config.text, 0, 0);
                                    ctx.restore();
                                } else {
                                    ctx.fillText(config.text, x, y);
                                }
                            }
                        } else if (config.type === 'image' && config.logoImg) {
                            const logo = config.logoImg;
                            const targetWidth = canvas.width * config.logoScale;
                            const targetHeight = (logo.height / logo.width) * targetWidth;

                            ctx.save();
                            ctx.globalAlpha = config.opacity;
                            let x = 40, y = 40, padding = 40;
                            if (config.position === 'bottom-center') { x = (canvas.width - targetWidth) / 2; y = canvas.height - targetHeight - padding; }
                            else if (config.position === 'bottom-right') { x = canvas.width - targetWidth - padding; y = canvas.height - targetHeight - padding; }
                            else if (config.position === 'bottom-left') { x = padding; y = canvas.height - targetHeight - padding; }
                            else if (config.position === 'top-right') { x = canvas.width - targetWidth - padding; y = padding; }
                            else if (config.position === 'top-left') { x = padding; y = padding; }
                            else if (config.position === 'center') { x = (canvas.width - targetWidth) / 2; y = (canvas.height - targetHeight) / 2; }
                            else if (config.position === 'custom') { x = config.customX; y = config.customY; }

                            if (config.angle !== 0) {
                                ctx.translate(x + targetWidth / 2, y + targetHeight / 2);
                                ctx.rotate((config.angle * Math.PI) / 180);
                                ctx.drawImage(logo, -targetWidth / 2, -targetHeight / 2, targetWidth, targetHeight);
                            } else {
                                ctx.drawImage(logo, x, y, targetWidth, targetHeight);
                            }
                            ctx.restore();
                        }

                        canvas.toBlob((blob) => { resolve(blob); }, file.type, 0.9);
                    };
                    img.src = e.target.result;
                };
                reader.readAsDataURL(file);
            });
        }

        async function addWatermarkToPDF(file, config) {
            const arrayBuffer = await file.arrayBuffer();
            const pdfDoc = await PDFLib.PDFDocument.load(arrayBuffer);
            const pages = pdfDoc.getPages();

            /*
              LƯU Ý QUAN TRỌNG cho PDF: pdf-lib KHÔNG đọc font "Josefin Sans" / "Life Savers"
              từ CSS/canvas được — nó chỉ có 14 font chuẩn PDF (Helvetica, Times...) trừ khi
              ta tự nhúng font TTF/OTF bằng @pdf-lib/fontkit. Đây là lý do watermark trên PDF
              trước đây luôn ra font mặc định dù chọn Josefin Sans/Life Savers — không phải do
              đoạn code JS ở trên, mà do thiếu bước nhúng font riêng cho pdf-lib.
              Bản sửa dưới đây tự tải file .ttf tương ứng và nhúng vào PDF để watermark chữ
              trên PDF cũng đúng font đã chọn.
            */
            const googleFontTtfUrls = {
                'Josefin Sans': 'https://raw.githubusercontent.com/google/fonts/main/ofl/josefinsans/JosefinSans%5Bwght%5D.ttf',
                'Life Savers': 'https://raw.githubusercontent.com/google/fonts/main/ofl/lifesavers/LifeSavers-Regular.ttf'
            };

            let customFont = null;
            if (config.type === 'text' && googleFontTtfUrls[config.font]) {
                try {
                    if (window.fontkit) {
                        pdfDoc.registerFontkit(window.fontkit);
                    }
                    const fontBytes = await fetch(googleFontTtfUrls[config.font]).then(r => r.arrayBuffer());
                    customFont = await pdfDoc.embedFont(fontBytes, { subset: true });
                } catch (err) {
                    console.warn(`Không nhúng được font "${config.font}" vào PDF, dùng font mặc định:`, err);
                    customFont = null;
                }
            }

            for (const page of pages) {
                const { width, height } = page.getSize();
                if (config.type === 'text') {
                    const rgba = hexToRgba(config.colorHex);
                    const drawOpts = {
                        x: width / 2, y: 50,
                        size: config.size,
                        color: PDFLib.rgb(rgba.r / 255, rgba.g / 255, rgba.b / 255),
                        opacity: config.opacity,
                        rotate: PDFLib.degrees(config.angle)
                    };
                    if (customFont) drawOpts.font = customFont;
                    page.drawText(config.text, drawOpts);
                }
            }
            return await pdfDoc.save();
        }
    </script>
    <!-- fontkit cần thiết để pdf-lib nhúng được font TTF tùy chỉnh vào PDF -->
    <script src="https://unpkg.com/@pdf-lib/fontkit@1.1.1/dist/fontkit.umd.min.js"></script>
</body>
</html>
